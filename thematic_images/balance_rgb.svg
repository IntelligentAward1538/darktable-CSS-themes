<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="200"
   height="200"
   viewBox="0 0 200 200"
   version="1.1">
  <!-- Marco exterior del módulo (gris estándar darktable) -->
  <rect
     x="22"
     y="22"
     width="156"
     height="156"
     rx="24"
     ry="24"
     fill="none"
     stroke="#bebebe"
     stroke-width="10" />

  <!-- Aro de rueda cromática de referencia -->
  <circle
     cx="100"
     cy="100"
     r="50"
     fill="none"
     stroke="#bebebe"
     stroke-width="8"
     stroke-opacity="0.75" />

  <!-- Ejes radiales RGB a 120 grados -->
  <!-- Eje Rojo (Superior: 0 deg) -->
  <line
     x1="100"
     y1="100"
     x2="100"
     y2="50"
     stroke="#e05a5a"
     stroke-width="9"
     stroke-linecap="round" />

  <!-- Eje Verde (Inferior derecha: 120 deg -> dx = 50*sin(120)=43.3, dy = -50*cos(120)=25) -->
  <line
     x1="100"
     y1="100"
     x2="143.3"
     y2="125"
     stroke="#58b86c"
     stroke-width="9"
     stroke-linecap="round" />

  <!-- Eje Azul (Inferior izquierda: 240 deg -> dx = -43.3, dy = 25) -->
  <line
     x1="100"
     y1="100"
     x2="56.7"
     y2="125"
     stroke="#5490e0"
     stroke-width="9"
     stroke-linecap="round" />

  <!-- Nodos de control RGB -->
  <circle cx="100" cy="50" r="10" fill="#e05a5a" />
  <circle cx="143.3" cy="125" r="10" fill="#58b86c" />
  <circle cx="56.7" cy="125" r="10" fill="#5490e0" />

  <!-- Pivote central neutro -->
  <circle
     cx="100"
     cy="100"
     r="11"
     fill="#bebebe" />
</svg>
